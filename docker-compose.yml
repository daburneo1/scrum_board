name: scrum-board

services:
  db:
    image: postgres:16-alpine
    container_name: scrum-board-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend/wsScrumBoard
      dockerfile: Dockerfile

    container_name: scrum-board-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      
      JWT_KEY: ${JWT_KEY:?JWT_KEY is required}

      Database__ApplyMigrations: "true"

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "${API_PORT}:8080"

  frontend:
    build:
      context: ./frontend/appWebScrumBoard
      dockerfile: Dockerfile

    container_name: scrum-board-frontend
    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  postgres_data:
