<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <img
            src="assets/layout/images/logo-dark.svg"
            alt="ScrumBoard"
            class="mb-5 w-6rem flex-shrink-0"
        >

        <div
            style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);"
        >
            <div
                class="w-full surface-card py-8 px-5 sm:px-8 flex flex-column align-items-center text-center"
                style="border-radius:53px"
            >
                <span class="text-primary font-bold text-3xl">
                    404
                </span>

                <h1 class="text-900 font-bold text-3xl lg:text-5xl mb-2">
                    Página no encontrada
                </h1>

                <div class="text-600 mb-5">
                    El recurso solicitado no está disponible.
                </div>

                <a
                    [routerLink]="['/projects']"
                    class="p-button font-bold px-5 py-3"
                >
                    Volver a proyectos
                </a>
            </div>
        </div>
    </div>
</div>
