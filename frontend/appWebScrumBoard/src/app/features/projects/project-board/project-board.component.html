<p-confirmDialog></p-confirmDialog>

<ng-container
    *ngIf="realtimeState$ | async as realtimeState"
>
    <p-tag
        [value]="getRealtimeLabel(realtimeState)"
        [severity]="getRealtimeSeverity(realtimeState)"
    ></p-tag>
</ng-container>

<div *ngIf="errorMessage" class="p-error mb-3">
    {{ errorMessage }}
</div>

<div *ngIf="board" class="board-page">
    <div class="flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h2 class="m-0">{{ board.projectName }}</h2>
            <span class="text-600">Tablero del proyecto</span>
        </div>

        <div class="flex flex-wrap gap-2">
            <button
                pButton
                type="button"
                label="Agregar columna"
                icon="pi pi-plus"
                (click)="openCreateColumn()"
            ></button>

            <button
                pButton
                type="button"
                label="Exportar PDF"
                icon="pi pi-file-pdf"
                class="p-button-outlined"
                [loading]="downloadingReport === 'pdf'"
                [disabled]="downloadingReport !== null"
                (click)="downloadReport('pdf')"
            ></button>

            <button
                pButton
                type="button"
                label="Exportar Excel"
                icon="pi pi-file-excel"
                class="p-button-outlined p-button-success"
                [loading]="downloadingReport === 'xlsx'"
                [disabled]="downloadingReport !== null"
                (click)="downloadReport('xlsx')"
            ></button>
        </div>
    </div>

    <div class="board-container" cdkDropListGroup>
        <section
            *ngFor="
        let column of board.columns;
        let index = index;
        trackBy: trackColumnById
    "
            class="board-column"
        >
            <header class="column-header">
                <div>
                    <strong>{{ column.name }}</strong>
                    <span class="ml-2 text-500">
                        {{ column.tasks.length }}
                    </span>
                </div>

                <div>
                    <button
                        pButton
                        type="button"
                        icon="pi pi-angle-left"
                        class="p-button-rounded p-button-text"
                        [disabled]="index === 0"
                        (click)="moveColumn(index, -1)"
                    ></button>

                    <button
                        pButton
                        type="button"
                        icon="pi pi-angle-right"
                        class="p-button-rounded p-button-text"
                        [disabled]="index === board.columns.length - 1"
                        (click)="moveColumn(index, 1)"
                    ></button>

                    <button
                        pButton
                        icon="pi pi-pencil"
                        class="p-button-rounded p-button-text"
                        (click)="openEditColumn(column)"
                    ></button>

                    <button
                        pButton
                        icon="pi pi-trash"
                        class="p-button-rounded p-button-text p-button-danger"
                        (click)="confirmDeleteColumn(column)"
                    ></button>
                </div>
            </header>

            <div
                class="task-list"
                cdkDropList
                [id]="column.id"
                [cdkDropListData]="column.tasks"
                [cdkDropListDisabled]="movingTaskId !== null"
                (cdkDropListDropped)="dropTask($event)"
            >
                <article
                    *ngFor="
            let task of column.tasks;
            trackBy: trackTaskById
        "
                    class="task-card"
                    cdkDrag
                    [cdkDragData]="task"
                    [cdkDragDisabled]="movingTaskId !== null"
                >
                    <div class="flex justify-content-between align-items-start">
                        <div class="flex align-items-center gap-2">
                <span
                    cdkDragHandle
                    class="drag-handle"
                    aria-label="Arrastrar tarea"
                    title="Arrastrar tarea"
                >
                    <i class="pi pi-bars"></i>
                </span>

                            <strong>
                                {{ task.title }}
                            </strong>
                        </div>

                        <p-tag
                            [value]="getPriorityLabel(task.priority)"
                            [severity]="getPrioritySeverity(task.priority)"
                        ></p-tag>
                    </div>

                    <p class="text-600">
                        {{ task.description || 'Sin descripción' }}
                    </p>

                    <small>
                        <i class="pi pi-user mr-1"></i>

                        {{
                            task.assignedUserName ||
                            'Sin responsable'
                        }}
                    </small>

                    <div class="mt-3">
                        <button
                            pButton
                            type="button"
                            icon="pi pi-pencil"
                            class="p-button-rounded p-button-text"
                            [disabled]="movingTaskId !== null"
                            (click)="openEditTask(task)"
                        ></button>

                        <button
                            pButton
                            type="button"
                            icon="pi pi-trash"
                            class="p-button-rounded p-button-text p-button-danger"
                            [disabled]="movingTaskId !== null"
                            (click)="confirmDeleteTask(task)"
                        ></button>
                    </div>
                </article>

                <div
                    *ngIf="column.tasks.length === 0"
                    class="empty-column"
                >
                    Arrastra una tarea aquí
                </div>
            </div>

            <button
                pButton
                label="Agregar tarea"
                icon="pi pi-plus"
                class="p-button-text w-full mt-3"
                (click)="openCreateTask(column)"
            ></button>
        </section>
    </div>
</div>

<p-dialog
    [(visible)]="columnDialogVisible"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '32rem' }"
    [header]="editingColumnId ? 'Editar columna' : 'Nueva columna'"
>
    <form
        id="column-form"
        [formGroup]="columnForm"
        (ngSubmit)="saveColumn()"
        class="p-fluid"
    >
        <div class="field">
            <label for="columnName">Nombre</label>
            <input id="columnName" pInputText formControlName="name">
            <small
                *ngIf="columnForm.controls.name.invalid && columnForm.controls.name.touched"
                class="p-error"
            >
                El nombre es obligatorio.
            </small>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <button
            pButton
            type="button"
            label="Cancelar"
            icon="pi pi-times"
            class="p-button-text"
            (click)="columnDialogVisible = false"
        ></button>
        <button
            pButton
            type="submit"
            form="column-form"
            label="Guardar"
            icon="pi pi-check"
            [loading]="savingColumn"
            [disabled]="savingColumn"
        ></button>
    </ng-template>
</p-dialog>

<p-dialog
    [(visible)]="taskDialogVisible"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '40rem' }"
    [header]="editingTaskId ? 'Editar tarea' : 'Nueva tarea'"
>
    <form
        id="task-form"
        [formGroup]="taskForm"
        (ngSubmit)="saveTask()"
        class="p-fluid"
    >
        <div class="field">
            <label for="taskTitle">Título</label>
            <input id="taskTitle" pInputText formControlName="title">
            <small
                *ngIf="taskForm.controls.title.invalid && taskForm.controls.title.touched"
                class="p-error"
            >
                El título es obligatorio.
            </small>
        </div>

        <div class="field">
            <label for="taskDescription">Descripción</label>
            <textarea
                id="taskDescription"
                pInputTextarea
                formControlName="description"
                rows="4"
            ></textarea>
        </div>

        <div class="field">
            <label for="taskPriority">Prioridad</label>
            <p-dropdown
                inputId="taskPriority"
                formControlName="priority"
                [options]="priorityOptions"
                optionLabel="label"
                optionValue="value"
                appendTo="body"
            ></p-dropdown>
        </div>

        <div class="field">
            <label for="taskUser">Responsable</label>
            <p-dropdown
                inputId="taskUser"
                formControlName="assignedUserId"
                [options]="users"
                optionLabel="name"
                optionValue="id"
                placeholder="Sin responsable"
                [showClear]="true"
                appendTo="body"
            ></p-dropdown>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <button
            pButton
            type="button"
            label="Cancelar"
            icon="pi pi-times"
            class="p-button-text"
            (click)="taskDialogVisible = false"
        ></button>
        <button
            pButton
            type="submit"
            form="task-form"
            label="Guardar"
            icon="pi pi-check"
            [loading]="savingTask"
            [disabled]="savingTask"
        ></button>
    </ng-template>
</p-dialog>
