<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="card project-list-page">
    <div class="project-list-heading">
        <div>
            <h2>Proyectos</h2>
            <span>Administra tus tableros ScrumBoard.</span>
        </div>
    </div>

    <p-toolbar styleClass="project-list-toolbar">
        <ng-template pTemplate="left">
            <button
                pButton
                pRipple
                type="button"
                label="Nuevo proyecto"
                icon="pi pi-plus"
                class="p-button-success"
                (click)="openCreate()"
            ></button>
        </ng-template>

        <ng-template pTemplate="right">
            <span class="p-input-icon-left">
                <i class="pi pi-search"></i>

                <input
                    pInputText
                    type="text"
                    [formControl]="filterControl"
                    placeholder="Buscar por nombre"
                >
            </span>
        </ng-template>
    </p-toolbar>

    <p-table
        [value]="projects"
        [lazy]="true"
        [paginator]="true"
        [rows]="pageSize"
        [first]="first"
        [totalRecords]="totalRecords"
        [loading]="loading"
        [rowsPerPageOptions]="[5, 10, 20, 50]"
        styleClass="project-table p-datatable-sm"
        responsiveLayout="scroll"
        (onLazyLoad)="onLazyLoad($event)"
    >
        <ng-template pTemplate="header">
            <tr>
                <th>Nombre</th>
                <th>Descripcion</th>
                <th>Inicio</th>
                <th>Fin previsto</th>
                <th>Estado</th>
                <th style="width: 14rem">Acciones</th>
            </tr>
        </ng-template>

        <ng-template
            pTemplate="body"
            let-project
        >
            <tr>
                <td>
                    <div class="project-name">{{ project.name }}</div>
                </td>

                <td>
                    <span class="project-description">{{ project.description || 'Sin descripcion' }}</span>
                </td>

                <td>
                    {{ project.startDate }}
                </td>

                <td>
                    {{ project.expectedEndDate }}
                </td>

                <td>
                    <p-tag
                        [value]="getStatusLabel(project.status)"
                        [severity]="getStatusSeverity(project.status)"
                    ></p-tag>
                </td>

                <td class="project-actions">
                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-th-large"
                        class="p-button-rounded p-button-text"
                        aria-label="Abrir tablero"
                        pTooltip="Abrir tablero"
                        tooltipPosition="top"
                        (click)="openBoard(project)"
                    ></button>

                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-pencil"
                        class="p-button-rounded p-button-text"
                        aria-label="Editar"
                        pTooltip="Editar proyecto"
                        tooltipPosition="top"
                        (click)="openEdit(project)"
                    ></button>

                    <button
                        pButton
                        pRipple
                        type="button"
                        icon="pi pi-trash"
                        class="p-button-rounded p-button-text p-button-danger"
                        aria-label="Eliminar"
                        pTooltip="Eliminar proyecto"
                        tooltipPosition="top"
                        (click)="confirmDelete(project)"
                    ></button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td
                    colspan="6"
                    class="text-center py-5"
                >
                    No se encontraron proyectos.
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog
    [(visible)]="dialogVisible"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '42rem' }"
    styleClass="scrum-dialog"
    [breakpoints]="{ '960px': '75vw', '640px': '95vw' }"
    [header]="
        editingProjectId
            ? 'Editar proyecto'
            : 'Nuevo proyecto'
    "
>
    <form
        id="project-form"
        [formGroup]="form"
        (ngSubmit)="save()"
        class="p-fluid scrum-form"
    >
        <div class="field">
            <label for="name">
                Nombre
            </label>

            <input
                id="name"
                pInputText
                formControlName="name"
            >

            <small
                *ngIf="
                    form.controls.name.invalid &&
                    form.controls.name.touched
                "
                class="p-error"
            >
                El nombre es obligatorio.
            </small>
        </div>

        <div class="field">
            <label for="description">
                Descripcion
            </label>

            <textarea
                id="description"
                pInputTextarea
                formControlName="description"
                rows="4"
            ></textarea>
        </div>

        <div class="grid">
            <div class="field col-12 md:col-6">
                <label for="startDate">
                    Fecha de inicio
                </label>

                <p-calendar
                    inputId="startDate"
                    formControlName="startDate"
                    dateFormat="yy-mm-dd"
                    [showIcon]="true"
                    appendTo="body"
                ></p-calendar>
            </div>

            <div class="field col-12 md:col-6">
                <label for="expectedEndDate">
                    Fin previsto
                </label>

                <p-calendar
                    inputId="expectedEndDate"
                    formControlName="expectedEndDate"
                    dateFormat="yy-mm-dd"
                    [showIcon]="true"
                    appendTo="body"
                ></p-calendar>
            </div>
        </div>

        <div class="field">
            <label for="status">
                Estado
            </label>

            <p-dropdown
                inputId="status"
                formControlName="status"
                [options]="statusOptions"
                optionLabel="label"
                optionValue="value"
                appendTo="body"
            ></p-dropdown>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <div class="dialog-actions">
            <button
                pButton
                pRipple
                type="button"
                label="Cancelar"
                icon="pi pi-times"
                class="p-button-text"
                (click)="dialogVisible = false"
            ></button>

            <button
                pButton
                pRipple
                type="submit"
                form="project-form"
                label="Guardar"
                icon="pi pi-check"
                [loading]="saving"
                [disabled]="saving"
            ></button>
        </div>
    </ng-template>
</p-dialog>
